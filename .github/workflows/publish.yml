name: Publish images

# Builds the three images and pushes them to GHCR so a deployment can pull a
# branch instead of compiling it. Building on the target host is slow (the
# backend compiles @discordjs/opus and cpu-features from source) and fails in
# ways CI never sees, because the host's toolchain is not the one CI tested.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# Images are addressed by branch name, so a second push to a branch replaces
# the tag a deployment pulls. Cancel the older run rather than let two builds
# race to publish the same tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing should not stop the other two from publishing: a
      # partial set is still useful for whichever service is being tested.
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: Dockerfile.backend
          - image: frontend
            dockerfile: Dockerfile.frontend
          - image: sidecar
            dockerfile: Dockerfile.sidecar
    steps:
      - uses: actions/checkout@v5

      # GHCR refuses an uppercase path and this repository's owner is mixed
      # case, so the name cannot be written literally.
      - name: Resolve image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A branch tag carries slashes that a Docker tag cannot: metadata-action
      # rewrites claude/my-branch to claude-my-branch. The long SHA tag is the
      # one to pin when a deployment must not move under you.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Only amd64: the known deployment target is an Intel NAS, and
          # emulating arm64 would multiply the build time for nothing.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image so the backend's slow native-module layer is not
          # evicted by the sidecar's cache. The scope is keyed on the
          # Dockerfile name, not the image name, because that is what the CI
          # workflow's matrix carries — the two must match or neither reuses
          # the other's layers.
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
