version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ts6-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/packages/backend/data/ts6webui.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - TS_ALLOW_SELF_SIGNED=${TS_ALLOW_SELF_SIGNED:-false}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MUSIC_DIR=/data/music
      - SIDECAR_URL=http://ts6-sidecar:9800
      - SIDECAR_TOKEN=${SIDECAR_TOKEN:-}
    volumes:
      - backend-data:/app/packages/backend/data
      - music-data:/data/music
    ports:
      - "3001:3001"
    depends_on:
      - sidecar
    networks:
      - ts6-network

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    container_name: ts6-sidecar
    restart: unless-stopped
    environment:
      - SIDECAR_PORT=9800
      # Reachable by the backend over the internal bridge network only —
      # do not publish this port: the API has no per-user authentication.
      - SIDECAR_LISTEN_ADDR=0.0.0.0
      - SIDECAR_TOKEN=${SIDECAR_TOKEN:-}
    networks:
      - ts6-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ts6-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - ts6-network

volumes:
  backend-data:
    driver: local
  music-data:
    driver: local

networks:
  ts6-network:
    driver: bridge
