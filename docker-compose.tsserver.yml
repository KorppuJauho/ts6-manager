# TeamSpeak server only — pair this with `pnpm dev` for day-to-day work.
#
#   docker compose -f docker-compose.tsserver.yml up -d
#   pnpm dev
#
# The manager then runs natively (hot reload, real stack traces) and its music
# bots join the server in this container. For a full containerised stack that mirrors
# production instead, use docker-compose.test.yml.
#
# Published ports are shifted off the production numbers (+1) so this can run
# on a host that already serves a real TeamSpeak server without colliding.
# Connect a client to port 9988, and give a music bot voice port 9988 too.
#
# See docs/local-testing.md for the WSL2 networking setting this needs and
# what a local rig can and cannot verify.

services:
  teamspeak:
    # No default: the image depends on which TeamSpeak server build you have.
    # Set TS_SERVER_IMAGE in .env — see docs/local-testing.md.
    image: "${TS_SERVER_IMAGE:?set TS_SERVER_IMAGE in .env - see docs/local-testing.md}"
    container_name: ts6-test-server
    restart: unless-stopped
    environment:
      # TeamSpeak 6 reads TSSERVER_*; TS3SERVER_LICENSE is the TeamSpeak 3
      # image's name and stays for anyone testing against one. Without the
      # TSSERVER_ acknowledgement a TS6 server exits at once and restarts
      # forever.
      - TS3SERVER_LICENSE=accept
      - TSSERVER_LICENSE_ACCEPTED=accept
      # The query interfaces (WebQuery, SSH) stay at their TS6 default, off:
      # the music bot joins as an ordinary client on the voice port.
    ports:
      # Voice. UDP — this is the one that needs mirrored networking on WSL2
      # for a Windows TeamSpeak client to reach it over localhost.
      - "${TEST_TS_VOICE_PORT:-9988}:9987/udp"
      # File transfer.
      - "${TEST_TS_FILE_PORT:-30034}:30033"
    # State is deliberately ephemeral: a test rig is more useful when
    # `docker compose down -v` gives you a clean server. To keep it, add a
    # volume here mounted at your image's data directory (the official images
    # have used /var/ts3server).
