# TeamSpeak server only — pair this with `pnpm dev` for day-to-day work.
#
#   docker compose -f docker-compose.tsserver.yml up -d
#   pnpm dev
#
# The manager then runs natively (hot reload, real stack traces) and talks to
# the server in this container. For a full containerised stack that mirrors
# production instead, use docker-compose.test.yml.
#
# See docs/local-testing.md for the WSL2 networking setting this needs, how to
# get the WebQuery API key, and what a local rig can and cannot verify.

services:
  teamspeak:
    # No default: the image depends on which TeamSpeak server build you have.
    # This project speaks WebQuery (the ServerQuery replacement in modern
    # builds), so a server old enough to only offer telnet ServerQuery will
    # not work. Set TS_SERVER_IMAGE in .env — see docs/local-testing.md.
    image: "${TS_SERVER_IMAGE:?set TS_SERVER_IMAGE in .env - see docs/local-testing.md}"
    container_name: ts6-test-server
    restart: unless-stopped
    environment:
      # Most TeamSpeak server images refuse to start without an explicit
      # licence acknowledgement. Check your image's docs for the exact name;
      # this is the variable the official images have used.
      - TS3SERVER_LICENSE=accept
    ports:
      # Voice. UDP — this is the one that needs mirrored networking on WSL2
      # for a Windows TeamSpeak client to reach it over localhost.
      - "9987:9987/udp"
      # WebQuery HTTP API. This is what the manager actually talks to; it is
      # the `webqueryPort` on a server connection, default 10080.
      - "10080:10080"
      # ServerQuery over SSH. Only needed to exercise the server-access
      # recovery feature; everything else works without it.
      - "10022:10022"
      # File transfer.
      - "30033:30033"
    # State is deliberately ephemeral: a test rig is more useful when
    # `docker compose down -v` gives you a clean server. To keep it, add a
    # volume here mounted at your image's data directory (the official images
    # have used /var/ts3server).
