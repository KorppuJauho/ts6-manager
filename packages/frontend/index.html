<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG for browsers that take it; the PNG for those that do not (older
         Safari); the touch icon for a page saved to a phone's home screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamSpeak 6 Manager</title>
    <script>
      // Apply persisted theme before React renders to prevent flash
      try {
        var stored = JSON.parse(localStorage.getItem('ts6-ui') || '{}');
        var theme = (stored.state && stored.state.theme) || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch(e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
